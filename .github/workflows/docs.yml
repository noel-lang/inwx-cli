name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte für den GitHub-Pages-Deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deploys serialisieren, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Dependencies installieren
        run: npm ci
      # Baut die CLI, generiert die Befehlsreferenz frisch aus dem Code und baut VitePress.
      - name: Docs bauen
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
